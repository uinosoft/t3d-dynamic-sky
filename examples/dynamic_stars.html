<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>t3d-dynacim-sky - stars</title>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" type="text/css" href="./main.css">
</head>
<body>
	<!-- Import maps polyfill -->
	<!-- Remove this when import maps will be widely supported -->
	<script async src="./libs/es-module-shims.js"></script>

	<script type="importmap">
		{
			"imports": {
				"t3d": "./libs/t3d/build/t3d.module.js",
				"t3d/addons/": "./libs/t3d/examples/jsm/",
				"t3d-dynamic-sky": "../build/t3d.dynamicsky.module.js"
			}
		}
	</script>

	<script type="module">
		import * as t3d from 't3d';
		import { ForwardRenderer } from 't3d/addons/render/ForwardRenderer.js';
		import { OrbitControls } from 't3d/addons/controls/OrbitControls.js';
		import { AxisHelper } from 't3d/addons/objects/AxisHelper.js';
		import { GridHelper } from 't3d/addons/objects/GridHelper.js';
		import { Timer } from 't3d/addons/misc/Timer.js';

		import { Stars } from 't3d-dynamic-sky';

		import { GUI } from './libs/lil-gui.esm.min.js';

		let width = window.innerWidth || 2;
		let height = window.innerHeight || 2;

		const canvas = document.createElement('canvas');
		canvas.width = width;
		canvas.height = height;
		document.body.appendChild(canvas);

		const forwardRenderer = new ForwardRenderer(canvas);
		forwardRenderer.setClearColor(0, 0, 0, 1);

		const scene = new t3d.Scene();

		const camera = new t3d.Camera();
		camera.setPerspective(70 / 180 * Math.PI, width / height, 0.1, 1000);
		camera.position.set(0, 1, 5);
		scene.add(camera);

		const controller = new OrbitControls(camera, canvas);
		controller.target.set(0, 0, -0.5);

		const axis = new AxisHelper(2);
		axis.material.depthTest = false;
		axis.renderOrder = 1;
		scene.add(axis);

		const grid = new GridHelper(10, 10, 0xffffff, 0x888888);
		scene.add(grid);

		// create stars

		const params = { fov: 70 };

		let stars;

		fetch('./stars/StarsData-2048.bin').then(res => res.arrayBuffer()).then(arrayBuffer => {
			console.time('Create stars');
			stars = new Stars(new Float32Array(arrayBuffer));
			scene.add(stars);
			console.timeEnd('Create stars');
		
			stars.material.uniforms.starDistance = 1000; // same with camera far

			const rotation = new t3d.Euler();
			rotation.onChange(() => stars.euler.copy(rotation));

			// gui

			const gui = new GUI();

			gui.add(stars.material.uniforms, 'starIntensity', 0, 100, 1).name('Star Intensity');
			gui.add(stars.material.uniforms, 'heightFalloff', 0, 2, 0.01).name('Height Falloff');
			gui.add(stars.material.uniforms, 'starSize', 0, 30, 0.01).name('Star Size');
			gui.add(rotation, 'y', 0, Math.PI * 2, 0.01).name('Rotation Y');

			const cameraFolder = gui.addFolder('Camera').close();
			cameraFolder.add(params, 'fov', 10, 120, 1).name('FOV').onChange(value => {
				camera.setPerspective(value / 180 * Math.PI, width / height, 0.1, 1000);
			});

			const debugFolder = gui.addFolder('Debug').close();
			debugFolder.add(grid, 'visible').name('Grid');
		});

		//

		const timer = new Timer();
		function loop(timestamp) {
			requestAnimationFrame(loop);

			controller.update();
			timer.update(timestamp);

			if (stars) {
				stars.material.uniforms.time += timer.getDelta() * 0.5;
			}

			forwardRenderer.render(scene, camera);
		}
		requestAnimationFrame(loop);

		function onWindowResize() {
			width = window.innerWidth || 2;
			height = window.innerHeight || 2;

			camera.setPerspective(params.fov / 180 * Math.PI, width / height, 0.1, 1000);

			forwardRenderer.backRenderTarget.resize(width, height);
		}
		window.addEventListener('resize', onWindowResize, false);
	</script>
</body>
</html>
