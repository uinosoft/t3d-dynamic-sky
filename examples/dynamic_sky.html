<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>t3d - sky</title>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" type="text/css" href="./main.css">
</head>
<body>
	<!-- Import maps polyfill -->
	<!-- Remove this when import maps will be widely supported -->
	<script async src="./libs/es-module-shims.js"></script>

	<script type="importmap">
		{
			"imports": {
				"t3d": "./libs/t3d/build/t3d.module.js",
				"t3d/examples/jsm/": "./libs/t3d/examples/jsm/",
				"t3d-dynamic-sky": "../build/t3d.dynamicsky.module.js"
			}
		}
	</script>

	<script type="module">
		import * as t3d from 't3d';
		import { ForwardRenderer } from 't3d/examples/jsm/render/ForwardRenderer.js';
		import { OrbitControls } from 't3d/examples/jsm/controls/OrbitControls.js';
		import { Texture2DLoader } from 't3d/examples/jsm/loaders/Texture2DLoader.js';
		import { TextureCubeLoader } from 't3d/examples/jsm/loaders/TextureCubeLoader.js';

		import { SkyPrecomputeUtil, Sky } from 't3d-dynamic-sky';

		import { GUI } from './libs/lil-gui.esm.min.js';
		
		let width = window.innerWidth || 2;
		let height = window.innerHeight || 2;

		const container = document.createElement('div');
		document.body.appendChild(container);

		const canvas = document.createElement('canvas');
		canvas.width = width;
		canvas.height = height;
		container.appendChild(canvas);

		const forwardRenderer = new ForwardRenderer(canvas, { antialias: true, alpha: true });
		forwardRenderer.setClearColor(0, 0, 0, 0);

		const scene = new t3d.Scene();
		scene.environmentLightIntensity = 0.8;

		const cube_texture = new TextureCubeLoader().load([
			'./textures/cube/Night/px.jpg',
			'./textures/cube/Night/nx.jpg',
			'./textures/cube/Night/py.jpg',
			'./textures/cube/Night/ny.jpg',
			'./textures/cube/Night/pz.jpg',
			'./textures/cube/Night/nz.jpg'
		]);

		const camera = new t3d.Camera();
		camera.setPerspective(70 / 180 * Math.PI, width / height, 0.01, 1000);
		camera.position.set(0, 1, 5);
		scene.add(camera);

		const controller = new OrbitControls(camera, canvas);

		// scene

		const ambientLight = new t3d.AmbientLight(0x77aaff, 0.3);
		scene.add(ambientLight);

		const sphere_geometry = new t3d.SphereGeometry(0.5, 20, 20);
		const sphere_material = new t3d.PBRMaterial();
		sphere_material.diffuse.setHex(0xffffff);
		sphere_material.roughness = 0.7;
		sphere_material.metalness = 0.3;
		const sphere = new t3d.Mesh(sphere_geometry, sphere_material);
		sphere.castShadow = true;
		scene.add(sphere);

		const plane_geometry = new t3d.PlaneGeometry(5, 5);
		const plane_material = new t3d.PBRMaterial();
		plane_material.roughness = 1;
		plane_material.metalness = 0;
		plane_material.diffuse.setHex(0xffffff);
		const plane = new t3d.Mesh(plane_geometry, plane_material);
		plane.position.y = -0.5;
		plane.receiveShadow = true;
		scene.add(plane);

		// precompute

		const precomputeOptions = {
			transmittanceMapping: 1,
			use3DInscatterTexture: true,
			altitudeLayers: 4
		};

		let skyPrecomputeUtil;

		function precompute() {
			skyPrecomputeUtil && skyPrecomputeUtil.dispose();
			skyPrecomputeUtil = new SkyPrecomputeUtil(forwardRenderer.capabilities, precomputeOptions);
			skyPrecomputeUtil.computeTransmittance(forwardRenderer);
			skyPrecomputeUtil.computeInscatter(forwardRenderer);

			return skyPrecomputeUtil;
		}

		// sky and sun

		const sky = new Sky();
		scene.add(sky);

		const skyMaterial = sky.material;
		skyMaterial.defines.BACKGROUND = true;
		skyMaterial.uniforms._MoonSampler = new Texture2DLoader().load('./textures/Full_Moon_glow.jpg');
		skyMaterial.uniforms._OuterSpaceCube = cube_texture;
		skyMaterial.uniforms._uSkyNightParams = [1, 0.1, 0.1];

		const directionalLight = new t3d.DirectionalLight(0xffffff, 0.5);
		directionalLight.position.set(-10, 20, 30);
		directionalLight.castShadow = true;
		directionalLight.shadow.windowSize = 15;
		scene.add(directionalLight);

		const spherical = new t3d.Spherical(50, Math.PI / 4, Math.PI / 4);
		const vector3 = new t3d.Vector3();

		function setSunAndMoonDir() {
			vector3.setFromSpherical(spherical);

			directionalLight.position.copy(vector3);
			directionalLight.lookAt(new t3d.Vector3(), new t3d.Vector3(0, 1, 0));

			vector3.normalize();

			vector3.toArray(skyMaterial.uniforms['_SunDirSize']);
			vector3.multiplyScalar(-1);
			vector3.toArray(skyMaterial.uniforms['_MoonDirSize']);
		}

		sky.setPrcomputeTextures(precompute());
		setSunAndMoonDir();

		// gui

		const gui = new GUI();

		const precomputeFolder = gui.addFolder('Precompute').onChange(() => {
			sky.setPrcomputeTextures(precompute());
		}).close();
		precomputeFolder.add(precomputeOptions, 'transmittanceMapping', { 'Linear': 0, 'Mapping-2008': 1, 'Mapping-2017': 2 }).name('Transmittance Mapping');
		precomputeFolder.add(precomputeOptions, 'use3DInscatterTexture').name('3D Inscatter');
		precomputeFolder.add(precomputeOptions, 'altitudeLayers', [1, 4]).name('Altitude Layers');

		const altitudeFolder = gui.addFolder('Altitude');
		altitudeFolder.add(skyMaterial.defines, 'BACKGROUND').name('Fixed Altitude').onChange(value => {
			skyMaterial.needsUpdate = true;
		});
		altitudeFolder.add(skyMaterial.uniforms, 'cameraHeight', 0, 60000).name('Altitude').listen();

		const miePhaseFolder = gui.addFolder('Mie Phase');
		miePhaseFolder.add(skyMaterial.uniforms, 'miePhaseG', 0, 1, 0.01).name('Mie Phase G');
		miePhaseFolder.add(skyMaterial.uniforms, 'miePhaseScale', 0, 5, 0.01).name('SkyMieScale');

		const sunFolder = gui.addFolder('Sun');
		sunFolder.add(skyMaterial.defines, 'SKY_SUNDISK').name('Sun Disk').onChange(value => {
			skyMaterial.needsUpdate = true;
		});
		sunFolder.add(skyMaterial.uniforms._SunDirSize, 3, 0, 8, 0.1).name('Sun Disk Size');
		sunFolder.add(spherical, 'phi', 0, Math.PI).onChange(setSunAndMoonDir).name('Longitudinal Angle');
		sunFolder.add(spherical, 'theta', 0, Math.PI * 2).onChange(setSunAndMoonDir).name('Horizontal Angle');

		const nightFolder = gui.addFolder('Night Sky');
		nightFolder.add(skyMaterial.defines, 'NIGHT_SKY').name('Enable').onChange(value => {
			skyMaterial.needsUpdate = true;
		});

		const toneMappingFolder = gui.addFolder('Tone Mapping');
		toneMappingFolder.add(skyMaterial.defines, 'TONE_MAPPING', {
			'Linear': 0,
			'Reinhard': 1,
			'Optimized Cineon': 2,
			'ACES Filmic': 3,
			'Neutral': 4,
			'AgX': 5,
			'Unity (Legacy)': 6
		}).name('Tone Mapping').onChange(value => {
			skyMaterial.needsUpdate = true;
		});
		toneMappingFolder.add(skyMaterial.uniforms, 'toneMappingExposure', 1, 100, 1).name('Exposure');
		toneMappingFolder.add(skyMaterial.defines, 'SRGB_OUTPUT').name('sRGB Output').onChange(value => {
			skyMaterial.needsUpdate = true;
		});

		const otherFolder = gui.addFolder('Other').close();

		otherFolder.add(skyMaterial, 'dithering').name('Dithering').onChange(value => {
			skyMaterial.needsUpdate = true;
		});

		otherFolder.add(skyMaterial.uniforms, '_SkyboxOcean', 0, 1, 0.01).name('Skybox Ocean');

		otherFolder.addColor(skyMaterial.uniforms, '_MoonInnerCorona').name('Moon Inner Corona');
		otherFolder.addColor(skyMaterial.uniforms, '_MoonOuterCorona').name('Moon Outer Corona');

		otherFolder.add(skyMaterial.uniforms._MoonInnerCorona, 3, 0, 5, 0.01).name('Inner Corona Factor');
		otherFolder.add(skyMaterial.uniforms._MoonOuterCorona, 3, 0, 5, 0.01).name('Outer Corona Factor');

		otherFolder.add(skyMaterial.uniforms._MoonDirSize, 3, 0, 8, 0.1).name('Moon Size');

		otherFolder.addColor(skyMaterial.uniforms, '_NightHorizonColor').name('Night Horizon Color');
		otherFolder.addColor(skyMaterial.uniforms, '_NightZenithColor').name('Night Zenith Color');

		otherFolder.add(skyMaterial.uniforms._NightHorizonColor, 3, 0, 1, 0.001).name('Night Horizon Factor');
		otherFolder.add(skyMaterial.uniforms._NightZenithColor, 3, 0, 1, 0.001).name('Night Zenith Factor');

		otherFolder.add(skyMaterial.uniforms._uSkyNightParams, 0, 0, 1, 0.01).name('Night Param0');
		otherFolder.add(skyMaterial.uniforms._uSkyNightParams, 1, 0, 1, 0.01).name('Night Param1');
		otherFolder.add(skyMaterial.uniforms._uSkyNightParams, 2, 0, 1, 0.01).name('Night Param2');

		//

		function loop(count) {
			requestAnimationFrame(loop);

			controller.update();

			if (!skyMaterial.defines.BACKGROUND) {
				skyMaterial.uniforms.cameraHeight = camera.position.y;
			}

			forwardRenderer.render(scene, camera);
		}
		requestAnimationFrame(loop);

		function onWindowResize() {
			width = window.innerWidth || 2;
			height = window.innerHeight || 2;

			camera.setPerspective(70 / 180 * Math.PI, width / height, 1, 1000);

			forwardRenderer.backRenderTarget.resize(width, height);
		}
		window.addEventListener('resize', onWindowResize, false);
	</script>
</body>
</html>
