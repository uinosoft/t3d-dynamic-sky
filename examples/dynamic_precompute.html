<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>t3d - precompute</title>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
</head>

<body>
	<!-- Import maps polyfill -->
	<!-- Remove this when import maps will be widely supported -->
	<script async src="./libs/es-module-shims.js"></script>

	<script type="importmap">
		{
			"imports": {
				"t3d": "./libs/t3d/build/t3d.module.js",
				"t3d/examples/jsm/": "./libs/t3d/examples/jsm/",
				"t3d-dynamic-sky": "../build/t3d.dynamicsky.module.js"
			}
		}
	</script>

	<script type="module">
		import * as t3d from 't3d';
		import { OrbitControls } from 't3d/examples/jsm/controls/OrbitControls.js';
		import { Texture2DLoader } from 't3d/examples/jsm/loaders/Texture2DLoader.js';
		import { SkyPrecomputeUtil } from "t3d-dynamic-sky";

		let width = window.innerWidth || 2;
		let height = window.innerHeight || 2;

		const container = document.createElement('div');
		document.body.appendChild(container);

		const canvas = document.createElement('canvas');
		canvas.width = width;
		canvas.height = height;
		container.appendChild(canvas);

		const contextParams = { antialias: false, alpha: false };
		const gl = canvas.getContext("webgl2", contextParams) || cloudsCanvas.getContext("webgl", contextParams);
		const renderer = new t3d.WebGLRenderer(gl);

		const backRenderTarget = new t3d.RenderTargetBack(canvas);

		const capabilities = renderer.capabilities;

		const skyPrecomputeUtil = new SkyPrecomputeUtil(capabilities);
		skyPrecomputeUtil.computeTransmittance(renderer);
		skyPrecomputeUtil.computeInscatter(renderer);

		const scene = new t3d.Scene();

		const camera = new t3d.Camera();
		camera.position.set(0, 0, 10);
		camera.setPerspective(30 / 180 * Math.PI, width / height, 0.01, 100);
		scene.add(camera);

		const material1 = new t3d.BasicMaterial();
		material1.diffuseMap = skyPrecomputeUtil.transmittanceTexture;
		material1.side = t3d.DRAW_SIDE.DOUBLE;
		const geometry1 = new t3d.PlaneGeometry(2, 2);
		const plane1 = new t3d.Mesh(geometry1, material1);
		plane1.euler.x = Math.PI / 2;
		plane1.position.set(-1, 0, 0);
		scene.add(plane1);

		const VolumeShader = {
			name: 'volume',

			defines: {},

			uniforms: {
				densityTexture: null,
			},

			vertexShader: `
			attribute vec3 a_Position;
			attribute vec2 a_Uv;

			uniform mat4 u_ProjectionView;
			uniform mat4 u_Model;

			varying vec2 v_Uv;

			void main() {
				v_Uv = a_Uv;
				gl_Position = u_ProjectionView * u_Model * vec4(a_Position, 1.0);
			}
			`,

			fragmentShader: `
			precision highp sampler3D;
			varying vec2 v_Uv;

			uniform sampler3D densityTexture;

			float xNumber = 8.;
			float yNumber = 4.;

			void main() {
			vec3 uvLayer;
			vec2 coords = v_Uv;
			uvLayer = vec3(mod(coords.x * xNumber, 1.), mod(coords.y * yNumber,1.) ,coords.x * xNumber * coords.y * yNumber);
			
			vec4 color = texture(densityTexture, uvLayer);
			gl_FragColor = vec4(color.rgb , 1.0);
			}
		`
		};


		const shaderMaterial = new t3d.ShaderMaterial(VolumeShader);
		shaderMaterial.transparent = true;
		shaderMaterial.premultipliedAlpha = true;
		
		shaderMaterial.uniforms.densityTexture = skyPrecomputeUtil.inscatterTexture;

		shaderMaterial.uniforms.platteTexture = new Texture2DLoader().load('./textures/platte.png');
		new t3d.Matrix4().toArray(shaderMaterial.uniforms.uInvTransform);
		const geometry2 = new t3d.PlaneGeometry(2, 2);
		const plane2 = new t3d.Mesh(geometry2, shaderMaterial);
		plane2.euler.x = Math.PI / 2;
		plane2.position.set(1, 0, 0);
		scene.add(plane2);

		const controller = new OrbitControls(camera, canvas);

		function loop(count) {
			requestAnimationFrame(loop);

			controller.update();

			scene.updateMatrix();
			scene.updateRenderStates(camera);
			scene.updateRenderQueue(camera);

			renderer.setRenderTarget(backRenderTarget);
			renderer.setClearColor(0.2, 0.2, 0.2, 1);
			renderer.clear(true, true, true);
			renderer.renderScene(scene, camera);
		}
		requestAnimationFrame(loop);

		function onWindowResize() {
			width = window.innerWidth || 2;
			height = window.innerHeight || 2;

			camera.setPerspective(30 / 180 * Math.PI, width / height, 0.01, 100);

			backRenderTarget.resize(width, height);
		}
		window.addEventListener("resize", onWindowResize, false);
	</script>
</body>
</html>
