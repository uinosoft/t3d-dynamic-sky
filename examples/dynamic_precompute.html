<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>t3d - precompute</title>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" type="text/css" href="./main.css">
</head>
<body>
	<!-- Import maps polyfill -->
	<!-- Remove this when import maps will be widely supported -->
	<script async src="./libs/es-module-shims.js"></script>

	<script type="importmap">
		{
			"imports": {
				"t3d": "./libs/t3d/build/t3d.module.js",
				"t3d/examples/jsm/": "./libs/t3d/examples/jsm/",
				"t3d-dynamic-sky": "../build/t3d.dynamicsky.module.js"
			}
		}
	</script>

	<script type="module">
		import * as t3d from 't3d';
		import { OrbitControls } from 't3d/examples/jsm/controls/OrbitControls.js';

		import { SkyPrecomputeUtil } from 't3d-dynamic-sky';
		import { PrecomputeHelper } from './jsm/PrecomputeHelper.js';

		import { GUI } from './libs/lil-gui.esm.min.js';

		let width = window.innerWidth || 2;
		let height = window.innerHeight || 2;

		const container = document.createElement('div');
		document.body.appendChild(container);

		const canvas = document.createElement('canvas');
		canvas.width = width;
		canvas.height = height;
		container.appendChild(canvas);

		const contextParams = { antialias: true, alpha: false };
		const gl = canvas.getContext('webgl2', contextParams) || canvas.getContext('webgl', contextParams);
		const renderer = new t3d.WebGLRenderer(gl);

		const backRenderTarget = new t3d.RenderTargetBack(canvas);
		
		const scene = new t3d.Scene();

		const camera = new t3d.Camera();
		camera.position.set(0, 1.5, 6);
		camera.setPerspective(30 / 180 * Math.PI, width / height, 0.01, 100);
		scene.add(camera);

		const controller = new OrbitControls(camera, canvas);

		//

		let skyPrecomputeUtil, transmittanceHelper, inscatterHelper;

		function precompute() {
			clear();

			skyPrecomputeUtil = new SkyPrecomputeUtil(renderer.capabilities, precomputeOptions);
			// skyPrecomputeUtil.setBetaRayleighDensity(new t3d.Vector3(680, 550, 440), new t3d.Color3(128 / 255, 128 / 255, 128 / 255, 255 / 255), 1.0);

			console.time('computeTransmittance');
			skyPrecomputeUtil.computeTransmittance(renderer);
			console.timeEnd('computeTransmittance');

			console.time('computeInscatter');
			skyPrecomputeUtil.computeInscatter(renderer);
			console.timeEnd('computeInscatter');

			transmittanceHelper = new PrecomputeHelper(skyPrecomputeUtil.transmittanceTexture);
			transmittanceHelper.position.set(-1.1, 0, 0);
			transmittanceHelper.scale.set(2, 1, 0.5);
			scene.add(transmittanceHelper);

			inscatterHelper = new PrecomputeHelper(skyPrecomputeUtil.inscatterTexture);
			inscatterHelper.position.set(1.1, 0, 0);
			if (skyPrecomputeUtil.use3DInscatterTexture) {
				inscatterHelper.scale.set(2, 0.5, 1);
			} else {
				inscatterHelper.scale.set(2, 1, 2);
			}
			scene.add(inscatterHelper);
		}

		function clear() {
			skyPrecomputeUtil && skyPrecomputeUtil.dispose();

			if (transmittanceHelper) {
				transmittanceHelper.geometry.dispose();
				transmittanceHelper.material.dispose();
				scene.remove(transmittanceHelper);
			}

			if (inscatterHelper) {
				inscatterHelper.geometry.dispose();
				inscatterHelper.material.dispose();
				scene.remove(inscatterHelper);
			}
		}

		const precomputeOptions = {
			transmittanceMapping: 1,
			inscatterMapping: 1,
			use3DInscatterTexture: true,
			altitudeLayers: 4
		};
		
		precompute();

		// gui

		const gui = new GUI();
		gui.onChange(precompute);
		gui.add(precomputeOptions, 'transmittanceMapping', { 'Linear': 0, 'Mapping-2008': 1, 'Mapping-2017': 2 }).name('Transmittance Mapping');
		gui.add(precomputeOptions, 'inscatterMapping', { 'Linear': 0, 'Non-Linear': 1 }).name('Inscatter Mapping');
		gui.add(precomputeOptions, 'use3DInscatterTexture').name('3D Inscatter');
		gui.add(precomputeOptions, 'altitudeLayers', [1, 4]).name('Altitude Layers');

		//

		function loop(count) {
			requestAnimationFrame(loop);

			controller.update();

			scene.updateMatrix();
			scene.updateRenderStates(camera);
			scene.updateRenderQueue(camera);

			renderer.setRenderTarget(backRenderTarget);
			renderer.setClearColor(0.1, 0.1, 0.1, 1);
			renderer.clear(true, true, true);
			renderer.renderScene(scene, camera);
		}
		requestAnimationFrame(loop);

		function onWindowResize() {
			width = window.innerWidth || 2;
			height = window.innerHeight || 2;

			camera.setPerspective(30 / 180 * Math.PI, width / height, 0.01, 100);

			backRenderTarget.resize(width, height);
		}
		window.addEventListener('resize', onWindowResize, false);
	</script>
</body>
</html>
